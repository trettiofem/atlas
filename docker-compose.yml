services:
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-2026.07.1}
    ports:
      # Bound to localhost only: the database is not meant to be reachable from the network.
      - "127.0.0.1:7474:7474" # Neo4j Browser
      - "127.0.0.1:7687:7687" # Bolt, what index.ts connects to
    environment:
      # The image only reads this on first start. To change the password later, run
      # `docker compose down -v` (this deletes the data) and start again.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD, at least 8 characters}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  neo4j-data:
